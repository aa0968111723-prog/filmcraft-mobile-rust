name: Rust core
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run -p filmcraft-mobile-smoke --locked
  portable-core:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: macos-latest
            target: aarch64-apple-ios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Checks the portable library only; does not build or sign an APK/IPA.
      - run: cargo check -p filmcraft-mobile-core --lib --locked --target ${{ matrix.target }}
  android-dependency-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android
      - run: cargo fmt --manifest-path tools/android-dependency-probe/Cargo.toml --check
      # Compile-only experiment: no Android SDK, APK, decoder or audio session is launched.
      - run: cargo clippy --manifest-path tools/android-dependency-probe/Cargo.toml --target aarch64-linux-android --locked -- -D warnings
