[package]
name = "filmcraft-mobile-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
filmcraft-mobile-core.workspace = true
serde_json.workspace = true
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow"] }
log = "0.4"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["android-native-activity"] }
android-activity = { version = "=0.6.1", features = ["native-activity"] }
android_logger = "=0.15.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["x11", "wayland"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
